[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "python-telegram"
dynamic = ["version"]
description = "Python library to help you build your own Telegram clients"
readme = "README.md"
authors = [{name = "Alexander Akhmetov", email = "me@alx.cx"}]
license = {text = "MIT"}
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["telegram", "client", "api", "tdlib", "tdjson", "td"]
dependencies = [
    "telegram-text==0.2.0",
]
requires-python = ">=3.10"

[project.urls]
Source = "https://github.com/alexander-akhmetov/python-telegram"
Documentation = "https://python-telegram.readthedocs.io/latest/"
Tutorial = "https://python-telegram.readthedocs.io/latest/tutorial.html"
Changelog = "https://python-telegram.readthedocs.io/latest/changelog.html"

# Single source of truth for the version. The docs import telegram from the
# source tree without installing it, so the version has to be readable there.
[tool.hatch.version]
path = "telegram/__init__.py"

# Everything under telegram/ that git tracks, which is the python sources and
# py.typed. The libtdjson binary is not in git: hatch_build.py adds it to the
# wheel and retags it, driven by PYTHON_TELEGRAM_TDLIB_TARGET and tdlib.lock.
[tool.hatch.build.targets.wheel]
packages = ["telegram"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# The sdist must never carry a binary: it is the fallback for the platforms no
# wheel covers, and a binary in it would work on exactly one of them.
[tool.hatch.build.targets.sdist]
include = [
    "telegram",
    "docs",
    "README.md",
    "CONTRIBUTING.md",
    "LICENSE",
]
exclude = ["telegram/lib"]

[tool.ruff]
line-length = 119
